name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Default gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - name: Install pinned nightly formatter
        run: rustup toolchain install nightly-2026-07-03 --profile minimal --component rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Markdown formatter
        run: npm install --global prettier@3.6.2
      - name: Install Python formatter and linter
        run: python -m pip install ruff==0.16.6
      - uses: Swatinem/rust-cache@v2
      - name: Run static repository checks
        run: ./scripts/ci-local.sh static
      - name: Run Rust checks and deterministic tests
        run: ./scripts/ci-local.sh rust
      - name: Run documentation tests
        run: ./scripts/ci-local.sh doc

  installer-bundle:
    name: Linux installer adapter and bundle scenarios
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore pinned installer build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/kapsel/installer
          key: linux-installer-1.98.0-x86_64-gnu-82150a52-${{ hashFiles('Cargo.lock') }}
      - name: Run named Linux installer scenarios
        run: python3 scripts/test-kapsel-installer-bundle.py

  coverage:
    name: Rust coverage (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_LLVM_COV_TARGET_DIR: target/llvm-cov-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          workspaces: ". -> target/llvm-cov-target"
      - name: Generate deterministic Rust coverage
        id: coverage
        shell: bash
        run: |
          rm -f codecov.json
          if timeout --signal=TERM --kill-after=30s 10m \
            cargo llvm-cov --locked --workspace --codecov --output-path codecov.json \
            && test -s codecov.json
          then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            rm -f codecov.json
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Coverage unavailable::Coverage generation failed or exceeded its 10-minute bound (status $status); correctness remains owned by the default gate."
          fi
      - name: Upload informational coverage
        if: steps.coverage.outputs.available == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: codecov.json
          disable_search: true
          fail_ci_if_error: false
          flags: rust-deterministic
          name: rust-deterministic

  release-artifact:
    name: x86-64 GNU/Linux release artifact
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assemble strict artifact A
        id: artifact-a
        shell: bash
        run: |
          archive=$(python3 scripts/assemble-release-artifact.py \
            --output-directory "$RUNNER_TEMP/kapsel-release-a")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Verify and smoke-test exact artifact A
        run: python3 scripts/test-release-artifact.py --archive "${{ steps.artifact-a.outputs.archive }}"
      - name: Assemble B and compare deterministic bytes
        run: python3 scripts/test-release-reproducibility.py --reference-archive "${{ steps.artifact-a.outputs.archive }}"
      - name: Stage exact artifact A for upload
        if: github.event_name == 'push'
        env:
          ARCHIVE_A: ${{ steps.artifact-a.outputs.archive }}
        shell: bash
        run: |
          set -eu
          mkdir dist
          for suffix in '' .sha256 .spdx.json .SHA256SUMS; do
            source="$ARCHIVE_A$suffix"
            destination="dist/$(basename "$source")"
            cp -- "$source" "$destination"
            cmp -- "$source" "$destination"
          done
      - name: Upload deterministic archive and sidecars
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: kapsel-x86_64-unknown-linux-gnu-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.spdx.json
            dist/*.tar.gz.SHA256SUMS
          if-no-files-found: error
          compression-level: 0
